name: Update LZ-Alt30 and publish Pages

on:
  push:
    branches: [main]
  schedule:
    # 01:17 UTC = 09:17 Beijing time. Avoid the top-of-hour Actions queue.
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lz-alt30-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch complete daily samples
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/update_prices.py
      - name: Build static index data
        run: python scripts/build_site.py
      - name: Verify index and data pipeline
        run: python -m unittest discover -s tests -v
      - name: Commit validated daily records
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git add data/daily_prices.csv data/quote_times.csv site/data/index.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: append validated daily price sample"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
